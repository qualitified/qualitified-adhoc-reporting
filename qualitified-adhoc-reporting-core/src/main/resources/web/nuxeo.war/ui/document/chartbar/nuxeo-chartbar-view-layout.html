<dom-module id="nuxeo-chartbar-view-layout">
  <template>
    <style include="reporting-styles">
      chart-bar {
        /* height: 100% !important; */
        width: 100% !important;
        min-width: 30em;
        display: block;
        font-size: .8rem;
        margin-top: 35px;
      }
    </style>

    <qualitified-repository-data start-date="[[_formatDate(startDate)]]"
                           end-date="[[_extendEndDate(endDate)]]"
                           data="{{data}}"
                           index="[[index]]"
                           ecm-primary-type="[[document.properties.report:primarytype]]"
                           ecm-lifecycle-state="[[document.properties.report:lifeCycleState]]"
                           ecm-mixin-type="[[document.properties.report:mixintype]]"
                           date-field="[[document.properties.report:dateField]]"
                           grouped-by="[[document.properties.report:groupedBy]]"
                           group-limit="[[document.properties.report:groupLimit]]"
                           with-date-intervals="[[document.properties.report:withDateIntervals]]"
                           where="[[_setWhereTerm(document.properties.report:responsibleUser, responsibleUser)]]"
                           metrics="[[document.properties.report:metrics]]"
                           documents="{{chartDocuments}}">
    </qualitified-repository-data>

    <nuxeo-page-provider id="provider" page-size="1000"
                         query="[[_query(data)]]"
                         schemas="*"
                         current-page="{{documents}}">
    </nuxeo-page-provider>
    <div id="outerDiv" on-mouseover="_show" on-mouseout="_hide" >
      <nuxeo-card heading="[[document.properties.dc:title]]">
        <div id="displaybtns" class="buttons">
          <div id="csvId" class="csvAction">
            <nuxeo-csv-export-button id="csvExport" provider="[[csvExport]]" schemas="[[_getSchemas(document)]]"></nuxeo-csv-export-button>
          </div>
          <div id="edit" hidden$="[[!editMode]]">
            <report-edit-delete document="{{document}}"></report-edit-delete>
          </div>
        </div>
        <chart-bar id="chartBar"
                   labels="[[_getLabels(chartDocuments)]]"
                   values="[[_getValues(chartDocuments)]]"
                   options='{ "legend": { "display": false }, "animation": false }'>
        </chart-bar>
      </nuxeo-card>
    </div>
    <slot></slot>
  </template>

  <script>
    Polymer({
      is: 'nuxeo-chartbar-view-layout',
      behaviors: [Nuxeo.LayoutBehavior, Report.DataBehavior],
      properties: {

        /**
         * @doctype ChartBar
         */
        document: {
          type: Object,
        },
        startDate: {
          type: String,
          value: ''
        },
        endDate: {
          type: String,
          value: ''
        },
        buttons: {
          type: Boolean,
          value: true
        },
        csvExport:{
         type: Object,
         value: {}
       }
      },

      resizeReport: function () {
        this.$.chartBar.resize();
      },
      ready:  function () {
       this.csvExport =this.$.provider;
     },

      _query: function (entries) {
        if (this.document && entries && entries.length > 0 && entries[0].key) {
          var values = entries.map(function (entry) {
            return '\'' + entry.key + '\'';
          }).join(',');
          return 'SELECT * FROM ' + this.document.properties['report:primarytype'] + ' WHERE ecm:uuid IN (' + values + ') ORDER BY ' + this.document.properties['report:dateField'] + ' ASC';
        }
        return '';
      },
      /*_labels Modified */
      _labels: function (data) {
        let dateFormat = this.document.properties['report:dateFormat'];
        if (dateFormat == "" || dateFormat == null) {
          dateFormat = "DD/MM/YYYY";
        }
        if (data) {
          return data.map(function (entry) {
            if (Array.isArray(entry.value)) {
              return entry.value.map(this._labels.bind(this));
            } else {
              /* Checks if the label is a date metadata otherwise returns the key*/
              if (moment(entry.key).isValid()) {
                return moment(entry.key).format(dateFormat);
              } else {
                return entry.key;
              }
            }
          });
        }
      },

      _getLabels: function (entries) {
        let labels = [];
        if (entries && entries.length > 0 && this.document && this.document.properties['report:keyMetadata']) {
          let keyMetadata = this.document.properties['report:keyMetadata'];
          let dateFormat = this.document.properties['report:dateFormat'] || 'DD/MM';
          for (let i = 0; i < entries.length; i++) {
            var raw = entries[i].properties && entries[i].properties[keyMetadata];
            labels.push(raw && moment(raw).isValid() ? moment(raw).format(dateFormat) : '');
          }
        } else {
          labels = this._labels(this.data) || [];
        }
        return labels;
      },

      _getValues: function (entries) {
        if (entries && entries.length > 0 && this.document && this.document.properties['report:valueMetadata']) {
          let valuesPart = [];
          let valueMetadata = this.document.properties['report:valueMetadata'];
          let value = 0;
          let cumulative = !!this.document.properties['report:metrics'];
          for (let i = 0; i < entries.length; i++) {
            var amount = Number(entries[i].properties && entries[i].properties[valueMetadata]);
            if (isNaN(amount)) {
              amount = 0;
            }
            if (cumulative && i > 0) {
              value += Number(entries[i - 1].properties && entries[i - 1].properties[valueMetadata]) || 0;
            }
            valuesPart.push(cumulative ? value + amount : amount);
          }
          return [valuesPart];
        }
        return this._values(this.data) || [[]];
      }
    });
  </script>
</dom-module>
