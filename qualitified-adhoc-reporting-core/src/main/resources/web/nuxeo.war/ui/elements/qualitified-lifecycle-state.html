<dom-module id="qualitified-lifecycle-state">
    <template>
        <style>
        </style>
        <nuxeo-operation id="updateListLifeCycle" op="LifeCycleEntries"></nuxeo-operation>


        <nuxeo-selectivity  data="[[lifeCycleStates]]"
                            min-chars=0
                            placeholder="[[i18n('placeholder.report.lifecycleState')]]"
                            label="[[i18n('label.report.lifecycleState')]]"
                            value="{{lifeCycleState}}"></nuxeo-selectivity>



    </template>

    <script>
        Polymer({
            is: 'qualitified-lifecycle-state',
            behaviors: [Nuxeo.LayoutBehavior],
            properties: {
                document: {
                    type: Object,
                },
                doctypelifecycle:{
                    type: String,
                    observer: '_docTypeChanged'
                },
                lifeCycleStates:{
                    type: Array,
                    notify: true
                },
                lifeCycleState: {
                    type: String,
                    notify: true,
                },
            },
            _docTypeChanged:function(){
                this.$.updateListLifeCycle.params = {"docTypeSelection": this.doctypelifecycle};
                this.$.updateListLifeCycle.execute().then(function (resp) {
                    const uniqueLifeCycleStates = [...new Set(resp)];
                    this.set("lifeCycleStates", uniqueLifeCycleStates);
                }.bind(this))
                    .catch(function(error) {
                        var empty = []
                        this.set("lifeCycleStates", empty)
                        // alert("No LifeCycle State found for the DocType Selection\n" + error);
                    }.bind(this));
            },

        });
    </script>
</dom-module>
